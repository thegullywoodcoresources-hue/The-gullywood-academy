<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>The Gullywood Academy — Admin</title>
<style>
:root{
  --ink:#14213d;--ink2:#22325a;--acc:#f59e0b;--acc-bg:#fff4dc;
  --bg:#f4f6fb;--card:#fff;--line:#e6e9f2;--muted:#6b7280;--txt:#111827;
  --g:#15803d;--g-bg:#e6f6ec;--r:#dc2626;--r-bg:#fdecec;--y:#b45309;--y-bg:#fff4dc;--b:#2563eb;--b-bg:#e8f0ff;
  --wa:#25d366;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:17px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.app{display:flex;min-height:100vh}

/* sidebar (desktop) */
.side{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.brand small{display:block;font-weight:500;opacity:.65;font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:4px;margin-top:26px;flex:1}
.side nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#cfd6e6;padding:11px 12px;border-radius:10px;text-align:left;font-weight:600}
.side nav button:hover{background:var(--ink2);color:#fff}
.side nav button.on{background:#fff;color:var(--ink)}
.side nav svg{width:20px;height:20px}
.side .foot{display:flex;gap:8px}
.side .foot button{flex:1;background:var(--ink2);border:0;color:#fff;border-radius:10px;padding:9px;font-size:13px;font-weight:600}

/* top bar (mobile) */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
.top .acts{display:flex;gap:6px}
.iconbtn{background:var(--ink2);border:0;color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:16px 14px 96px}

/* bottom nav (mobile) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:4px 0;font-weight:600}
.bnav button.on{color:var(--ink)}
.bnav button.on svg{stroke:var(--acc)}
.bnav svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media(min-width:900px){
  .side{display:flex;flex-direction:column;width:236px;flex:none;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;padding:22px 14px}
  .top,.bnav{display:none}
  main{padding:30px 36px 40px}
  h1{font-size:26px}
}

/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* buttons */
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--line);color:var(--txt);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--ink);color:#fff}
.btn.acc{background:var(--acc);color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--r-bg);color:var(--r)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--b);font-weight:600;padding:0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt{margin-top:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{font-size:21px;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.g b{color:var(--g)} .stat.r b{color:var(--r)}
.stat.hero{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.hero span,.stat.hero small{color:#c4cce0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:6px}

/* month picker / date bar */
.mpick{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.mpick button{background:none;border:0;width:40px;height:40px;font-size:20px;color:var(--ink)}
.mpick b{min-width:140px;text-align:center;font-size:14.5px}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.datebar input[type=date]{border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.chip.g{background:var(--g-bg);color:var(--g)} .chip.r{background:var(--r-bg);color:var(--r)}
.chip.y{background:var(--y-bg);color:var(--y)} .chip.n{background:#eef0f5;color:var(--muted)} .chip.b{background:var(--b-bg);color:var(--b)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;margin:2px 4px 0 0;color:#fff}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:#e9ecf3;border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;min-width:170px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff}
select.sel{border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fff}

/* class cards */
.ccard{display:flex;gap:12px;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left}
.ccard:hover{border-color:#c9cfdd}
.ccard .bar2{width:5px;border-radius:5px;flex:none}
.ccard .time{width:74px;flex:none;font-weight:800;font-size:13.5px}
.ccard .time small{display:block;color:var(--muted);font-weight:600}
.ccard .info{flex:1;min-width:0}
.ccard .info b{font-size:15.5px}
.ccard .right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;text-align:left}
button.item:hover{border-color:#c9cfdd}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--acc-bg);color:var(--y)}
.item .info{flex:1;min-width:0}
.item .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.feeitem{flex-wrap:wrap}
.feeitem .acts{width:100%}
@media(min-width:620px){.feeitem{flex-wrap:nowrap}.feeitem .acts{width:auto}}

.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.banner.y{background:var(--y-bg);color:#7c4a03}
.banner.r{background:var(--r-bg);color:#991b1b}
.banner.b{background:var(--b-bg);color:#1e3a8a}
.banner.g{background:var(--g-bg);color:#14532d}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:#fff;border:1px dashed var(--line);border-radius:16px}

/* table */
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;background:#fafbfd}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbfd}
tbody tr:last-child td{border-bottom:0}
@media(max-width:640px){
  table{min-width:0} thead{display:none}
  tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px;border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:0}
  tbody td{border:0;padding:0;white-space:normal}
  tbody td:first-child{width:100%}
  tbody td[data-l]::before{content:attr(data-l) " ";color:var(--muted);font-size:12px;font-weight:600}
}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-body{padding:16px 18px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.x{background:#eef0f5;border:0;width:32px;height:32px;border-radius:50%;font-size:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:#374151}
.field input,.field select,.field textarea{border:1px solid #d6dbe6;border-radius:11px;padding:10px 12px;background:#fff;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:600;font-size:13.5px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--ink);background:#f1f3f9}
.checks input{accent-color:var(--ink)}

/* attendance toggles */
.att-head{display:flex;gap:8px;margin-bottom:12px}
.att-head .stat{flex:1;padding:10px 12px}
.att-head .stat b{font-size:19px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.tog{border:0;border-radius:20px;padding:7px 0;width:94px;font-weight:800;font-size:13px}
.tog.p{background:var(--g-bg);color:var(--g)}
.tog.a{background:var(--r);color:#fff}
.stickybar{position:sticky;bottom:-18px;background:#fff;padding:12px 0 4px;margin-top:6px;display:flex;gap:8px}
.marks input{width:76px;border:1px solid #d6dbe6;border-radius:9px;padding:8px;text-align:center}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
.lock.hidden{display:none}
.lockbox{background:#fff;border-radius:22px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
.lockbox .logo{width:54px;height:54px;font-size:22px;margin:0 auto 14px;border-radius:16px}
.lockbox input{width:100%;text-align:center;font-size:24px;letter-spacing:10px;border:1.5px solid #d6dbe6;border-radius:12px;padding:12px;margin:18px 0 12px}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(min-width:900px){.toast{bottom:30px}}
@media print{.side,.top,.bnav,.noprint{display:none!important}main{padding:0}body{background:#fff}}
</style>
</head>
<body>

<div class="lock hidden" id="lock">
  <form class="lockbox" data-form="unlock">
    <div class="logo">GA</div>
    <h3 id="lockName">The Gullywood Academy</h3>
    <p class="sub">Admin panel · Staff only</p>
    <input type="password" inputmode="numeric" name="pin" maxlength="6" placeholder="••••" autocomplete="off">
    <button class="btn pri block">Unlock</button>
    <p class="sub small" style="margin-top:12px">Demo PIN: <b>1234</b></p>
  </form>
</div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">GA</div><div><span id="sideName">The Gullywood Academy</span><small>Admin panel</small></div></div>
    <nav id="sideNav"></nav>
    <div class="foot">
      <button data-act="settings">⚙︎ Settings</button>
      <button data-act="lock">🔒 Lock</button>
    </div>
  </aside>
  <div style="flex:1;min-width:0">
    <header class="top">
      <div class="brand"><div class="logo">GA</div><div><span id="topName">The Gullywood Academy</span><small>Admin panel</small></div></div>
      <div class="acts">
        <button class="iconbtn" data-act="settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="iconbtn" data-act="lock" aria-label="Lock"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="bnav" id="bNav"></nav>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheet-head"><h3 id="mTitle"></h3><button class="x" data-act="close" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="mBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = d => ymd(d).slice(0, 7);
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const METHODS = ['Cash','Bank transfer','JazzCash','Easypaisa'];
const COLORS = ['#0ea5e9','#8b5cf6','#f59e0b','#10b981','#ef4444','#ec4899','#14b8a6','#6366f1'];
const fmtRs = n => 'Rs ' + Math.round(n || 0).toLocaleString('en-US');
const fmtMonth = m => { const [y, mo] = m.split('-').map(Number); return `${MONTHS[mo - 1]} ${y}`; };
const fmtDate = s => { const d = parseYmd(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const fmtShort = s => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const fmtTime = t => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const shiftM = (m, d) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + d, 1)); };
const shiftD = (s, d) => { const t = parseYmd(s); t.setDate(t.getDate() + d); return ymd(t); };
const daysOfMonth = m => { const [y, mo] = m.split('-').map(Number); const n = new Date(y, mo, 0).getDate(); return Array.from({ length: n }, (_, i) => `${m}-${pad(i + 1)}`); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
const activeOn = (s, d) => s.joinDate <= d && !(s.status === 'left' && s.leftDate && s.leftDate <= d);
const activeInMonth = (s, m) => s.joinDate.slice(0, 7) <= m && !(s.status === 'left' && s.leftDate && s.leftDate.slice(0, 7) < m);
const TODAY = ymd(new Date());
const CUR_M = TODAY.slice(0, 7);

/* ============ demo data ============ */
function seed() {
  let r = 20261030;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), td = now.getDate();
  const dt = (mOff, d) => ymd(new Date(y, mo + mOff, d));
  const cm = ym(now), pm = ym(new Date(y, mo - 1, 1));
  const ph = () => '03' + pick(['00', '01', '21', '33', '45', '12', '23']) + '-' + String(Math.floor(rnd() * 1e7)).padStart(7, '0');

  const plans = [
    { id: 'p1', name: 'Early Batch', fee: 8000 },
    { id: 'p2', name: 'Regular', fee: 10000 },
    { id: 'p3', name: 'Crash Course', fee: 14000 },
  ];
  const classes = [
    { id: 'c1', name: 'Chemistry',   teacher: 'Sir Kamran Ali',   start: '10:00', end: '11:00', days: [1,2,3,4,5,6], color: '#0ea5e9' },
    { id: 'c2', name: 'English',     teacher: 'Miss Sana Tariq',  start: '12:00', end: '13:00', days: [1,2,3,4,5,6], color: '#8b5cf6' },
    { id: 'c3', name: 'Physics',     teacher: 'Sir Faraz Ahmed',  start: '14:00', end: '15:00', days: [1,2,3,4,5,6], color: '#f59e0b' },
    { id: 'c4', name: 'Mathematics', teacher: 'Sir Imran Shah',   start: '15:00', end: '16:00', days: [1,2,3,4,5,6], color: '#10b981' },

  const students = names.map((n, i) => {

    if (i < 11) { plan = plans[0]; join = dt(-2, 3 + Math.floor(rnd() * 20)); }
    else if (i < 15) { plan = plans[1]; join = dt(-1, 2 + Math.floor(rnd() * 20)); }
    else { plan = plans[2]; join = dt(0, 1 + Math.floor(rnd() * Math.max(1, td - 1))); }
    return { id: 's' + (i + 1), name: n, phone: ph(), parentPhone: ph(), classIds: ids, planId: plan.id, fee: plan.fee, joinDate: join, status: 'active' };

  if (dt(0, 7) < TODAY) cancels[dt(0, 7) + '|c3'] = 'Teacher unavailable (emergency)';
  const cur = new Date(y, mo - 1, 1);
  while (ymd(cur) < TODAY) {
    const d = ymd(cur), wd = cur.getDay();
    if (!holidays[d]) classes.forEach(c => {
      if (!c.days.includes(wd)) return;
      const k = d + '|' + c.id; if (cancels[k]) return;
      const roster = students.filter(s => s.classIds.includes(c.id) && activeOn(s, d));
      att[k] = { absent: roster.filter(() => rnd() < 0.09).map(s => s.id) };
    });
    cur.setDate(cur.getDate() + 1);
  }
  // first class of today already marked, so the demo shows both states
  const firstToday = classes.filter(c => c.days.includes(now.getDay())).sort((a, b) => a.start.localeCompare(b.start))[0];
  if (firstToday) {
    const roster = students.filter(s => s.classIds.includes(firstToday.id) && activeOn(s, TODAY));
    att[TODAY + '|' + firstToday.id] = { absent: roster.filter(() => rnd() < 0.12).map(s => s.id) };
  }

  const payments = {}, reminders = {};
  students.forEach(s => [pm, cm].forEach(m => {
    if (!activeInMonth(s, m)) return;
    const isCur = m === cm;
    if (!isCur && s.id === 's8') { reminders[m + '|' + s.id] = dt(-1, 2); return; }
    if (isCur && rnd() > 0.62) { if (td > 2) reminders[m + '|' + s.id] = dt(0, 2); return; }
    const day = 1 + Math.floor(rnd() * (isCur ? Math.min(9, Math.max(1, td - 1)) : 9));
    let pd = isCur ? dt(0, day) : dt(-1, day);
    if (pd < s.joinDate) pd = s.joinDate; if (pd > TODAY) pd = TODAY;
    payments[m + '|' + s.id] = { amount: s.fee, method: pick(METHODS), date: pd };

    let d = dt(mOff, day);

    const marks = {};
    students.filter(s => s.classIds.includes(cid) && activeOn(s, d)).forEach(s => {
      marks[s.id] = rnd() < 0.08 ? '' : Math.round(total * (0.48 + rnd() * 0.52));
    });
    return { id: uid(), classId: cid, title, date: d, total, marks };
  };
  const tests = [
    mkTest(-1, 'c4', 'Mathematics Test 1', 20, 40),

    },

  };

const KEY = 'gullywood-academy-demo-v1';
function load() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
  return seed();
}

/* ============ data helpers ============ */
const cls = id => S.classes.find(c => c.id === id);
const stu = id => S.students.find(s => s.id === id);
const planName = s => (S.plans.find(p => p.id === s.planId) || { name: 'Custom fee' }).name;
const classesOn = d => S.classes.filter(c => c.days.includes(parseYmd(d).getDay())).sort((a, b) => a.start.localeCompare(b.start));
const roster = (cid, d) => S.students.filter(s => s.classIds.includes(cid) && activeOn(s, d)).sort((a, b) => a.name.localeCompare(b.name));
function classStatus(d, cid) {
  if (S.holidays[d]) return 'holiday';
  if (S.cancels[d + '|' + cid]) return 'cancelled';
  if (S.att[d + '|' + cid]) return 'marked';
  if (d > TODAY) return 'upcoming';
  return 'pending';
}
function isLive(c) {
  const n = new Date(), mins = n.getHours() * 60 + n.getMinutes();
  const toM = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  return mins >= toM(c.start) && mins < toM(c.end);
}
function monthStats(s, m) {
  const r = { P: 0, A: 0, C: 0, by: {} };
  for (const d of daysOfMonth(m)) {
    if (d > TODAY) break;
    if (!activeOn(s, d)) continue;
    const wd = parseYmd(d).getDay();
    for (const cid of s.classIds) {
      const c = cls(cid); if (!c || !c.days.includes(wd)) continue;
      const b = r.by[cid] || (r.by[cid] = { P: 0, A: 0, C: 0 });
      const k = d + '|' + cid;
      if (S.holidays[d] || S.cancels[k]) { r.C++; b.C++; continue; }
      const a = S.att[k]; if (!a) continue;
      if (a.absent.includes(s.id)) { r.A++; b.A++; } else { r.P++; b.P++; }
    }
  }
  return r;
}
const pctOf = (a, b) => b ? Math.round(a * 100 / b) : 0;
const dueList = m => S.students.filter(s => activeInMonth(s, m)).sort((a, b) => a.name.localeCompare(b.name));
const payOf = (m, id) => S.payments[m + '|' + id];
function feeStatus(s, m) {
  const p = payOf(m, s.id);
  if (!p) return 'unpaid';
  return p.amount >= s.fee ? 'paid' : 'partial';
}
function money(m) {
  let exp = 0, rec = 0, unpaid = 0;
  const list = dueList(m);
  list.forEach(s => { exp += s.fee; const p = payOf(m, s.id); if (p) rec += p.amount; if (feeStatus(s, m) !== 'paid') unpaid++; });
  return { exp, rec, pend: Math.max(0, exp - rec), unpaid, n: list.length };
}
const testsOf = m => S.tests.filter(t => t.date.slice(0, 7) === m).sort((a, b) => b.date.localeCompare(a.date));
function fill(tpl, s, m, extra = {}) {
  const p = payOf(m, s.id);
  const amount = extra.amount != null ? extra.amount : (p && feeStatus(s, m) === 'partial' ? s.fee - p.amount : s.fee);
  return tpl.replace(/\{academy\}/g, S.settings.academy).replace(/\{student\}/g, s.name)
    .replace(/\{amount\}/g, fmtRs(amount)).replace(/\{month\}/g, fmtMonth(m)).replace(/\{method\}/g, extra.method || (p ? p.method : ''));
}
function waLink(phone, text) {
  let p = String(phone || '').replace(/\D/g, '');
  if (p.startsWith('0')) p = '92' + p.slice(1);
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function openWA(phone, text) { window.open(waLink(phone, text), '_blank'); }

const CHIP = { marked: ['Marked', 'g'], pending: ['Not marked', 'y'], cancelled: ['Cancelled', 'r'], holiday: ['Holiday', 'r'], upcoming: ['Upcoming', 'n'] };

      <select class="sel" id="repC"><option value="">All classes</option>${S.classes.map(c => `<option value="${c.id}" ${UI.repC === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    </div>
    <div id="list">${repTable()}</div>
    <p class="muted small">Tap a student to see class-wise attendance, every test mark and fee details. Cancelled classes and holidays are not counted as absent.</p>`;
  },
};

function stuList() {
  const q = UI.stuQ.toLowerCase();
  const list = S.students.filter(s => (UI.stuT === 'left' ? s.status === 'left' : s.status !== 'left'))
    .filter(s => !q || s.name.toLowerCase().includes(q) || s.phone.includes(q) || s.parentPhone.includes(q))
    .filter(s => !UI.stuC || s.classIds.includes(UI.stuC))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length) return `<div class="empty">No students found.</div>`;
  return list.map(s => `<button class="item" data-act="viewStudent" data-s="${s.id}">
    <div class="av">${initials(s.name)}</div>
    <div class="info"><b>${esc(s.name)}${s.joinDate.slice(0, 7) === CUR_M && s.status !== 'left' ? ' <span class="chip b" style="font-size:10.5px;padding:2px 7px">NEW</span>' : ''}</b>
      <div>${s.classIds.map(id => cls(id)).filter(Boolean).map(c => `<span class="tag" style="background:${c.color}">${esc(c.name)}</span>`).join('')}</div></div>
    <div style="text-align:right;flex:none"><b>${fmtRs(s.fee)}</b><div class="muted small">${s.status === 'left' ? 'Left ' + fmtShort(s.leftDate) : planName(s)}</div></div>
  </button>`).join('');
}

function feeList() {
  const m = UI.feeM, q = UI.feeQ.toLowerCase();
  const list = dueList(m).filter(s => !q || s.name.toLowerCase().includes(q))
    .filter(s => UI.feeF === 'all' || (UI.feeF === 'paid' ? feeStatus(s, m) === 'paid' : feeStatus(s, m) !== 'paid'));
  if (!list.length) return `<div class="empty">${UI.feeF === 'unpaid' ? 'Everyone has paid 🎉' : 'No students here.'}</div>`;
  return list.map(s => {
    const st = feeStatus(s, m), p = payOf(m, s.id), rem = S.reminders[m + '|' + s.id];
    const badge = st === 'paid' ? `<span class="chip g">Paid</span>` : st === 'partial' ? `<span class="chip y">Partial</span>` : `<span class="chip r">Unpaid</span>`;
    const sub = p ? `${st === 'partial' ? 'Paid ' + fmtRs(p.amount) + ' · ' : ''}${p.method} · ${fmtShort(p.date)}` : rem ? `Reminder sent ${fmtShort(rem)}` : `Parent: ${esc(s.parentPhone)}`;
    const acts = st === 'paid'
      ? `<button class="btn sm" data-act="receipt" data-s="${s.id}">${icon('wa')}Receipt</button><button class="btn ghost sm" data-act="unpay" data-s="${s.id}">Undo</button>`
      : `<button class="btn wa sm" data-act="remind" data-s="${s.id}" data-m="${m}">${icon('wa')}Remind</button><button class="btn pri sm" data-act="pay" data-s="${s.id}">Mark paid</button>`;
    return `<div class="item feeitem">
      <div class="av">${initials(s.name)}</div>
      <div class="info"><b>${esc(s.name)}</b><span class="muted small">${fmtRs(s.fee)} · ${sub}</span></div>
      ${badge}
      <div class="acts">${acts}</div>
    </div>`;
  }).join('');
}

function repRows() {
  const m = UI.repM, q = UI.repQ.toLowerCase(), tests = testsOf(m);
  return dueList(m).filter(s => !q || s.name.toLowerCase().includes(q)).filter(s => !UI.repC || s.classIds.includes(UI.repC)).map(s => {
    const st = monthStats(s, m), fs = feeStatus(s, m), p = payOf(m, s.id);
    const my = tests.filter(t => s.classIds.includes(t.classId) && t.marks[s.id] !== undefined && t.marks[s.id] !== '');
    const tp = my.length ? Math.round(my.reduce((a, t) => a + Number(t.marks[s.id]) / t.total, 0) / my.length * 100) : null;
    return { s, st, fs, p, my, tp };
  });
}
function repTable() {
  const rows = repRows();
  if (!rows.length) return `<div class="empty">No students for this month.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Student</th><th>Present</th><th>Absent</th><th>Attendance</th><th>Fee</th><th>Tests (avg)</th></tr></thead><tbody>
  ${rows.map(({ s, st, fs, p, my, tp }) => {
    const ap = st.P + st.A ? pctOf(st.P, st.P + st.A) : null;
    return `<tr class="click" data-act="repStudent" data-s="${s.id}">
      <td><b>${esc(s.name)}</b>${s.status === 'left' ? ' <span class="chip n">Left</span>' : ''}<div class="muted small">${s.classIds.map(id => (cls(id) || {}).name).filter(Boolean).join(', ')}</div></td>
      <td data-l="Present" style="color:var(--g);font-weight:700">${st.P}</td>
      <td data-l="Absent" style="color:var(--r);font-weight:700">${st.A}</td>
      <td>${ap == null ? '—' : `<span class="chip ${ap >= 85 ? 'g' : ap >= 70 ? 'y' : 'r'}">${ap}%</span>`}</td>
      <td>${fs === 'paid' ? `<span class="chip g">Paid ${fmtShort(p.date)}</span>` : fs === 'partial' ? `<span class="chip y">Partial ${fmtRs(p.amount)}</span>` : `<span class="chip r">Unpaid ${fmtRs(s.fee)}</span>`}</td>
      <td data-l="Tests">${tp == null ? '<span class="muted">—</span>' : `<b>${tp}%</b> <span class="muted small">(${my.length} test${my.length > 1 ? 's' : ''})</span>`}</td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

/* ============ modal ============ */
function openModal(title, html) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  $('#modal').classList.remove('hidden');
  $('#mBody').scrollTop = 0;
}
function closeModal() { $('#modal').classList.add('hidden'); M = null; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400); }

/* --- class attendance --- */
function openClass(d, cid) {
  const rec = S.att[d + '|' + cid];
  M = { type: 'class', d, cid, absent: new Set(rec ? rec.absent : []), cancelForm: false };
  renderClassModal();
}
function renderClassModal() {
  const { d, cid } = M, c = cls(cid), k = d + '|' + cid, list = roster(cid, d);
  const head = `<p class="muted" style="margin:-4px 0 12px">${fmtDate(d)} · ${fmtTime(c.start)}–${fmtTime(c.end)} · ${esc(c.teacher)}</p>`;
  let body;
  if (S.holidays[d]) {
    body = `<div class="banner r"><div>🏖️ <b>Holiday — ${esc(S.holidays[d])}.</b> No one is marked absent.</div></div>`;
  } else if (S.cancels[k]) {
    body = `<div class="banner r"><div>🚫 <b>Class cancelled</b> — ${esc(S.cancels[k])}.<br>Students are <b>not</b> marked absent for this class.</div></div>
      <button class="btn block" data-act="restoreClass">Restore class</button>`;
  } else if (M.cancelForm) {
    body = `<form data-form="cancelClass">
      <p>Cancel <b>${esc(c.name)}</b> on ${fmtDate(d)}? Students won't be marked absent.</p>
      <div class="field"><label>Reason</label>
        <select name="reason" id="cReason">${['Teacher unavailable (emergency)', 'Rain / weather', 'Load-shedding', 'Exam day', 'Other'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Note (optional)</label><input name="note" placeholder="e.g. Make-up class on Sunday"></div>
      <div class="row"><button type="button" class="btn ghost" data-act="cancelBack">Back</button><button class="btn danger" style="flex:1">Cancel class</button></div>
    </form>`;
  } else if (d > TODAY) {
    body = `<div class="banner b"><div>This class hasn't happened yet. You can mark attendance on the day — or cancel it in advance.</div></div>
      <p class="muted small">${list.length} students enrolled: ${list.map(s => esc(s.name)).join(', ')}</p>
      <button class="btn danger block" data-act="cancelForm">Cancel this class</button>`;
  } else {
    const a = [...M.absent].filter(id => list.some(s => s.id === id)).length;
    body = `<div class="att-head">${stat('Present', list.length - a, 'students', 'g')}${stat('Absent', a, 'students', 'r')}</div>
      <div class="between" style="margin-bottom:4px"><span class="muted small">Tap a student to switch Present ↔ Absent</span><button class="link small" data-act="allPresent">Mark all present</button></div>
      <div>${list.length ? list.map(s => {
        const ab = M.absent.has(s.id);
        return `<div class="srow"><div class="row"><div class="av" style="width:32px;height:32px;font-size:12px">${initials(s.name)}</div><b style="font-weight:600">${esc(s.name)}</b></div>
          <button class="tog ${ab ? 'a' : 'p'}" data-act="tog" data-s="${s.id}">${ab ? 'Absent' : 'Present'}</button></div>`;
      }).join('') : '<div class="empty">No students enrolled in this class yet.</div>'}</div>
      <div class="stickybar"><button class="btn danger" data-act="cancelForm">Cancel class</button><button class="btn pri" style="flex:1" data-act="saveAtt">${S.att[k] ? 'Update attendance' : 'Save attendance'}</button></div>`;
  }
  const keep = $('#mBody').scrollTop;
  openModal(c.name, head + body);
  $('#mBody').scrollTop = keep;
}

/* ============ CSV ============ */
function exportCSV() {
  const m = UI.repM, tests = testsOf(m).slice().reverse();
  const head = ['Student', 'Parent phone', 'Classes', 'Present', 'Absent', 'Cancelled', 'Attendance %', 'Monthly fee', 'Paid amount', 'Fee status', 'Paid on', 'Method', ...tests.map(t => `${t.title} (/${t.total})`)];
  const rows = repRows().map(({ s, st, fs, p }) => [s.name, s.parentPhone, s.classIds.map(id => (cls(id) || {}).name).join(' / '), st.P, st.A, st.C,
    st.P + st.A ? pctOf(st.P, st.P + st.A) : '', s.fee, p ? p.amount : 0, fs, p ? p.date : '', p ? p.method : '',
    ...tests.map(t => s.classIds.includes(t.classId) ? (t.marks[s.id] === '' ? 'Absent' : (t.marks[s.id] ?? '')) : '')]);
  const csv = [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = `${S.settings.academy.replace(/\s+/g, '-')}-report-${m}.csv`;
  a.click();
  toast('Report downloaded — opens in Excel');
}

/* ============ actions ============ */
const A = {
  nav: d => { UI.view = d.v; closeModal(); render(); window.scrollTo(0, 0); },
  close: () => closeModal(),
  mon: d => { UI[d.k + 'M'] = shiftM(UI[d.k + 'M'], +d.d); render(); },
  day: d => { UI.attDate = shiftD(UI.attDate, +d.d); render(); },
  dayToday: () => { UI.attDate = TODAY; render(); },
  holiday: () => openModal('Mark as holiday', `<form data-form="holiday">
      <p style="margin-top:0">All classes on <b>${fmtDate(UI.attDate)}</b> will be off and no student will be marked absent.</p>
      <div class="field"><label>Reason</label><select name="reason">${['Public holiday', 'Eid holidays', 'Emergency closure', 'Rain / weather', 'Exam break', 'Other'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <button class="btn danger block">Mark as holiday</button></form>`),
  unholiday: () => { delete S.holidays[UI.attDate]; save(); render(); toast('Holiday removed'); },
  openClass: d => openClass(d.d, d.c),
  tog: d => { M.absent.has(d.s) ? M.absent.delete(d.s) : M.absent.add(d.s); renderClassModal(); },
  allPresent: () => { M.absent.clear(); renderClassModal(); },
  saveAtt: () => {
    const list = roster(M.cid, M.d), absent = [...M.absent].filter(id => list.some(s => s.id === id));
    S.att[M.d + '|' + M.cid] = { absent, at: Date.now() }; save();
    toast(`${cls(M.cid).name} saved — ${list.length - absent.length} present, ${absent.length} absent`);
    closeModal(); render();
  },
  cancelForm: () => { M.cancelForm = true; renderClassModal(); },
  cancelBack: () => { M.cancelForm = false; renderClassModal(); },
  restoreClass: () => { delete S.cancels[M.d + '|' + M.cid]; save(); M.cancelForm = false; renderClassModal(); render(); toast('Class restored'); },
  manageClasses: () => classesModal(),
  editClass: d => classForm(d.id),
  delClass: d => {
    if (!confirmTwice(d)) return;
    S.classes = S.classes.filter(c => c.id !== d.id);
    S.students.forEach(s => s.classIds = s.classIds.filter(id => id !== d.id));
    save(); classesModal(); render(); toast('Class deleted');
  },
  addStudent: () => studentForm(null),
  editStudent: d => studentForm(stu(d.s)),
  viewStudent: d => studentDetail(d.s),
  repStudent: d => studentDetail(d.s, UI.repM),
  markLeft: d => {
    if (!confirmTwice(d, 'Tap again to confirm')) return;
    const s = stu(d.s); s.status = 'left'; s.leftDate = TODAY; save(); closeModal(); render();
    toast(`${s.name} marked as left — history kept in reports`);
  },
  readmit: d => { const s = stu(d.s); s.status = 'active'; delete s.leftDate; save(); closeModal(); render(); toast(`${s.name} re-admitted`); },
  stuT: d => { UI.stuT = d.t; render(); },
  feeF: d => { UI.feeF = d.f; render(); },
  remind: d => {
    const s = stu(d.s), m = d.m || UI.feeM;
    openWA(s.parentPhone, fill(S.settings.remind, s, m));
    S.reminders[m + '|' + s.id] = TODAY; save(); render();
    toast(`WhatsApp opened for ${s.name}'s parent`);
  },
  remindAll: () => {
    const m = UI.feeM;
    M = { type: 'ra', m, i: 0, queue: dueList(m).filter(s => feeStatus(s, m) !== 'paid').map(s => s.id) };
    remindAllStep();
  },
  raSend: () => { const s = stu(M.queue[M.i]); openWA(s.parentPhone, fill(S.settings.remind, s, M.m)); S.reminders[M.m + '|' + s.id] = TODAY; save(); M.i++; remindAllStep(); },
  raSkip: () => { M.i++; remindAllStep(); },
  pay: d => payForm(d.s),
  unpay: d => { delete S.payments[UI.feeM + '|' + d.s]; save(); render(); toast('Payment removed'); },
  receipt: d => { const s = stu(d.s), m = d.m || UI.feeM; const p = payOf(m, s.id); openWA(s.parentPhone, fill(S.settings.receipt, s, m, { amount: p.amount, method: p.method })); closeModal(); },
  newTest: () => newTestForm(),
  openTest: d => marksForm(d.id),
  delTest: d => { if (!confirmTwice(d)) return; S.tests = S.tests.filter(t => t.id !== d.id); save(); closeModal(); render(); toast('Test deleted'); },
  print: () => window.print(),
  csv: () => exportCSV(),
  settings: () => settingsModal(),
  addPlan: () => { S.plans.push({ id: 'p' + uid(), name: 'New plan', fee: 9000 }); save(); settingsModal(); },
  reset: d => { if (!confirmTwice(d, 'Tap again to reset everything')) return; try { localStorage.removeItem(KEY); } catch (e) {} S = seed(); save(); closeModal(); UI.view = 'home'; render(); toast('Demo data reset'); },
  lock: () => { try { sessionStorage.removeItem('gw-unlocked'); } catch (e) {} closeModal(); showLock(); },
};
function confirmTwice(d, msg = 'Tap again to confirm delete') {
  const el = document.activeElement;
  if (el && el.dataset.armed) return true;
  if (el) { el.dataset.armed = '1'; el.dataset.orig = el.textContent; el.textContent = msg; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = el.dataset.orig; } }, 3000); }
  else return window.confirm(msg);
  return false;
}

/* ============ forms ============ */
const F = {
  unlock: f => {
    if (f.pin.value === S.settings.pin) { try { sessionStorage.setItem('gw-unlocked', '1'); } catch (e) {} $('#lock').classList.add('hidden'); f.reset(); }
    else { toast('Wrong PIN'); f.pin.value = ''; }
  },
  student: f => {
    const fd = new FormData(f), name = fd.get('name').trim(), parent = fd.get('parent').trim(), classIds = fd.getAll('cls');
    if (!name || !parent || !classIds.length) { toast('Please add name, parent phone and at least one class'); return; }
    const data = { name, phone: fd.get('phone').trim(), parentPhone: parent, classIds, planId: fd.get('plan'), fee: Number(fd.get('fee')) || 0, joinDate: fd.get('join') || TODAY };
    if (f.dataset.id) { Object.assign(stu(f.dataset.id), data); toast('Student updated'); }
    else { S.students.push({ id: 's' + uid(), status: 'active', ...data }); toast(`${name} added ✓ — now on attendance & fee lists`); }
    save(); closeModal(); render();
  },
  pay: f => {
    const fd = new FormData(f), s = stu(f.dataset.s), m = UI.feeM;
    const p = { amount: Number(fd.get('amount')), method: fd.get('method'), date: fd.get('date') || TODAY };
    S.payments[m + '|' + s.id] = p; save(); render();
    openModal('Payment recorded ✓', `<div style="text-align:center">
      <div style="font-size:42px">✅</div><p><b>${fmtRs(p.amount)}</b> received from <b>${esc(s.name)}</b><br><span class="muted small">${p.method} · ${fmtDate(p.date)}</span></p>
      <button class="btn wa block" data-act="receipt" data-s="${s.id}" data-m="${m}">${icon('wa')}Send receipt on WhatsApp</button>
      <button class="btn ghost block mt" data-act="close">Done</button></div>`);
  },
  cancelClass: f => {
    const fd = new FormData(f), note = fd.get('note').trim();
    S.cancels[M.d + '|' + M.cid] = fd.get('reason') + (note ? ' — ' + note : '');
    delete S.att[M.d + '|' + M.cid]; save();
    toast(`${cls(M.cid).name} cancelled — no one marked absent`); closeModal(); render();
  },
  holiday: f => { S.holidays[UI.attDate] = new FormData(f).get('reason'); save(); closeModal(); render(); toast('Day marked as holiday'); },
  newTest: f => {
    const fd = new FormData(f);
    const t = { id: uid(), classId: fd.get('cls'), title: fd.get('title').trim(), date: fd.get('date') || TODAY, total: Number(fd.get('total')) || 1, marks: {} };
    S.tests.push(t); save(); UI.testM = t.date.slice(0, 7); render(); marksForm(t.id);
  },
  marks: f => {
    const t = S.tests.find(x => x.id === f.dataset.id);
    for (const [k, v] of new FormData(f).entries()) if (k.startsWith('m_')) t.marks[k.slice(2)] = v === '' ? '' : Math.min(t.total, Math.max(0, Number(v)));
    save(); closeModal(); render(); toast('Marks saved');
  },
  settings: f => {
    const fd = new FormData(f);
    S.settings.academy = fd.get('academy').trim() || 'The Gullywood Academy';
    S.settings.pin = fd.get('pin').trim() || '1234';
    S.settings.remind = fd.get('remind'); S.settings.receipt = fd.get('receipt');
    S.plans.forEach(p => { p.name = fd.get('pn_' + p.id) || p.name; p.fee = Number(fd.get('pf_' + p.id)) || p.fee; });
    save(); closeModal(); render(); toast('Settings saved');
  },
  class: f => {
    const fd = new FormData(f), days = fd.getAll('days').map(Number);
    if (!days.length) { toast('Pick at least one day'); return; }
    const data = { name: fd.get('name').trim(), teacher: fd.get('teacher').trim(), start: fd.get('start'), end: fd.get('end'), days, color: fd.get('color') || COLORS[0] };
    if (f.dataset.id) Object.assign(cls(f.dataset.id), data); else S.classes.push({ id: 'c' + uid(), ...data });
    save(); render(); classesModal(); toast('Class saved');
  },
};

/* ============ events ============ */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); el.focus && el.focus(); fn(el.dataset, el);
});
document.addEventListener('submit', e => { e.preventDefault(); const fn = F[e.target.dataset.form]; if (fn) fn(e.target); });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'stuQ') { UI.stuQ = e.target.value; $('#list').innerHTML = stuList(); }
  if (id === 'feeQ') { UI.feeQ = e.target.value; $('#list').innerHTML = feeList(); }
  if (id === 'repQ') { UI.repQ = e.target.value; $('#list').innerHTML = repTable(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'stuC') { UI.stuC = e.target.value; $('#list').innerHTML = stuList(); }
  if (id === 'repC') { UI.repC = e.target.value; $('#list').innerHTML = repTable(); }
  if (id === 'attDate' && e.target.value) { UI.attDate = e.target.value; render(); }
  if (id === 'fPlan') { const p = S.plans.find(x => x.id === e.target.value); if (p) $('#fFee').value = p.fee; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function showLock() { $('#lock').classList.remove('hidden'); setTimeout(() => $('#lock input').focus(), 50); }
let unlocked = false; try { unlocked = sessionStorage.getItem('gw-unlocked') === '1'; } catch (e) {}
render();
if (!unlocked) showLock();
</script>
</body>
</html>
